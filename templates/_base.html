<!-- templates/base.html -->

{% load compress %}
{% load static %}

<!DOCTYPE html>
<html>
{% include 'head.html' %}

<body class="bg-zinc-50">
    <title>
        {% block title %}
        {{page_title}}
        {% endblock %} | PESANEEN
    </title>

    <script>
      document.body.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
      })
    </script>
  </body>
</html>
