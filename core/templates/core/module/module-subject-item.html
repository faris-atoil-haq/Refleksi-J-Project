<div class="flex justify-between" id="subject-{{subject.id}}">
    <div class="text-base md:text-lg text-gray-900">{{subject.name}}</div>
    <button id="subject-{{subject.id}}-edit" type="button" class="font-normal px-2 btn-sm btn-light border-0"
        onclick="toggleEditSubject('{{subject.id}}', true)">
        <svg class="me-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"/>
        </svg>
        Sunting
    </button>
</div>
<div id="subject-{{subject.id}}-input" class="hidden flex justify-between gap-3">
    <input type="hidden" name="subject_id" value="{{subject.id}}">
    <input class="input-sm grow" type="text" name="name" value="{{subject.name}}">
    <div class="flex">
        <button class="btn btn-light-danger" hx-post="{% url 'subject' subject.id %}" hx-target="#subject-{{subject.id}}-container" name="delete" value="delete" type="button">Hapus</button>
        <button class="btn btn-primary" hx-post="{% url 'subject' subject.id %}" hx-include="#subject-{{subject.id}}-input"
        hx-trigger="click" hx-target="#subject-{{subject.id}}-row" hx-swap="innerHTML" type="button">Simpan</button>
        <button class="btn btn-light border-0" type="button" onclick="toggleEditSubject('{{subject.id}}')">
            <svg class="" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
            </svg>
        </button>
    </div>
</div>
