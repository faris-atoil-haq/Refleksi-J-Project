{% extends 'core/_base.html' %}
{% load custom_tags %}

{% block content %}
    <div class="w-full md:pe-6 mb-6 md:mb-8">
        <div class="flex flex-wrap justify-between">
            <div class="flex mb-4">
                <div class="flex flex-wrap md:flex-nowrap md:gap-0" hx-get="{% url 'schedule_items' %}" hx-target="#schedule-content" hx-include="[name='start_date'], [name='end_date'], [name='q']" hx-trigger="click from:#search-agenda">
                    <div id="date-range-picker" date-rangepicker class="flex items-center">
                        <div class="relative flex-grow md:flex-grow-0">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                                </svg>
                            </div>
                            <input id="datepicker-range-start" name="start_date" type="text" class="bg-white text-sm border border-gray-300 text-gray-900 rounded-s-md border-e-0 focus:ring-blue-500 focus:border-blue-500 block ps-10 px-2 py-2 w-[150px]" placeholder="Tanggal mulai">
                        </div>
                        <div class="relative flex-grow md:flex-grow-0">
                            <input id="datepicker-range-end" name="end_date" type="text" class="bg-white border text-sm border-x-0 rounded-e-md sm:border-e-2 md:rounded-none border-gray-300 text-gray-900 focus:ring-blue-500 focus:border-blue-500 block px-3 py-2 w-[120px]" placeholder="Tanggal akhir">
                        </div>
                    </div>
                    
                    <div class="relative flex-grow md:flex-grow-0">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
                            </svg>
                        </div>
                        <input type="hidden" name="page" value="{{page}}">
                        <input name="q" type="text" id="search" 
                            class="text-sm bg-white border border-gray-300 text-gray-900 focus:ring-blue-500 focus:outline-none focus:border-blue-500 block w-full ps-10 p-2"
                            placeholder="Cari"
                            {% if q %}value="{{q}}"{% endif %}>
                    </div>
                    <button type="button" id="search-agenda" class="btn btn-primary rounded-md rounded-s-none font-medium">
                        <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-width="3" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <button type="button" id="add-schedule-btn" data-drawer-target="add-schedule-drawer" data-drawer-show="add-schedule-drawer" data-drawer-placement="right" aria-controls="add-schedule-drawer" 
                    class="btn btn-primary py-2 pe-3 ps-2" type="button">
                    <svg class="w-5 h-5 text-white md:me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14m-7 7V5"/>
                    </svg>
                    <div class="font-medium text-sm">
                        Tambah Jadwal
                    </div>
                </button>
            </div>
        </div>
        <div class="flex">
                
            <div class="relative max-w-sm flex items-center">
                <input datepicker id="month-agenda" datepicker-format="MM yyyy" type="text" value="{{ now|datetime_as_timezone:'Asia/Jakarta'|date:'F' }} {{ now|datetime_as_timezone:'Asia/Jakarta'|date:'Y' }}" 
                    hx-get="{% url 'schedule_items' %}" hx-trigger="monthChanged" hx-target="#schedule-content"
                    name="month"
                    class="bg-white text-blue-700 font-medium text-sm rounded-md border border-blue-500 focus:ring-blue-500 focus:border-blue-500 w-[150px] me-3 px-3 py-1.5">
                <input type="hidden" id="currentSelectedMonth" name="currentSelectedMonth" value="August 2024">
                <script>
                    $( document ).ready(function (){
                        document.getElementById('month-agenda').addEventListener('changeDate', function(event) {
                            if (this.value !== document.getElementById('currentSelectedMonth').value) {
                                document.getElementById('currentSelectedMonth').value = this.value;
                                document.getElementById('month-agenda').dispatchEvent(new Event('monthChanged'));
                            }
                        });
                    });
                </script>
            </div>

            <button type="button" class="text-gray-600 bg-white border-gray-300 border hover:bg-gray-50 hover:text-blue-600 focus:ring-1 focus:outline-none focus:ring-blue-600 font-medium rounded-md text-sm px-3 py-1 me-4" onclick="goNearestToday()">
                Hari ini
            </button>
        </div>
    </div>
    
    <div id="schedule-content" class="w-full" hx-get="{% url 'schedule_items' %}" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></div>
{% endblock %}
