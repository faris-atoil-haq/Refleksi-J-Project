{% extends "_base.html" %}
{% load static %}

{% block content %}
  

<div class="flex justify-center py-8">
    <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow md:p-8">
        <form method="POST" id="submit-form" >
            {% csrf_token %}
                <h5 class="mb-6 text-xl font-medium text-gray-900">Lupa kata sandi</h5>
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email Anda</label>
                    <div class="text-sm text-gray-500">
                        <input type="email" name="email" autocomplete="email" id="email" class="mb-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="name@email.com" required 
                        {% if email %}value="{{email}}"{% endif %}>
                        <div>Jika email Anda sudah terdaftar, kami akan mengirimkan tautan untuk mengubah password Anda melalui email</div>
                    </div>
                </div>

                <button type="submit" class="mb-6 w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Kirim email</button>
        </form>
    </div>
</div>

{% endblock content %}
