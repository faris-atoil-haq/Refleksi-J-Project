{% load static %}

<div class="w-full p-6 pt-1 mb-6 bg-white border border-gray-200 rounded-lg shadow" id="article-card-{{order}}">
    <input type="hidden" name="id" value="{{id}}" />
    <div class="w-full py-1 cursor-grab grab-handler flex justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-grip-horizontal" viewBox="0 0 16 16">
            <path d="M2 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
        </svg>
    </div>
    <div class="flex justify-between">
        <div><span id="num-1" class="bg-yellow-100 text-yellow-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded">No. {{order}}
        </span></div>
        
        <button id="manage-article-{{order}}" data-dropdown-toggle="manage-article-menu-{{order}}"
            class="inline-flex items-center p-2 text-sm font-medium text-center text-gray-900 bg-white rounded-lg hover:bg-gray-100 focus:ring-4 focus:outline-none dark:text-white focus:ring-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 dark:focus:ring-gray-600" type="button">
            <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 4 15">
            <path d="M3.5 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 6.041a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 5.959a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/>
            </svg>
        </button>    
        <!-- Dropdown menu -->
        <div id="manage-article-menu-{{order}}" class="z-10 hidden bg-white divide-y divide-gray-100 rounded-md shadow">
            <ul class="py-2 text-sm text-gray-700" aria-labelledby="manage-article-{{order}}">
                <li>
                    <form action="{% url 'manage_article' id=id %}" method="POST">
                        {% csrf_token %}
                        <button type="submit" name="delete" value="delete" class="block px-4 py-2 hover:bg-red-600 hover:text-white">Hapus</a>
                    </form>
                </li>
            </ul>
        </div>
    </div>
    
    <form class="mt-6" hx-swap="outerHTML" hx-target="#article-card-{{order}}" hx-post="{% url 'manage_article' id=id %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="relative z-0 w-full mb-5 group">
            <input type="text" name="article-title" id="article-title-{{order}}" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " 
                {% if title %}value="{{title}}"{% endif %} required />
            <div class="py-2">
                <div id="cover-container" class="{% if not cover_image %}hidden{% endif %} flex justify-center">
                    <label for="file-input-{{order}}" class="py-2 relative max-w-sm transition-all duration-300 cursor-pointer filter grayscale hover:grayscale-0">
                        <img class="h-auto max-w-full rounded-lg" id="image-cover" src="{% if cover_image %}{{cover_image.url}}{% endif %}" alt="image description">
                        <figcaption class="absolute px-4 text-lg text-white bottom-6">
                            <p>Gambar Cover</p>
                        </figcaption>
                    </label>
                </div>
                
                <div class="flex justify-center">
                    <label class="py-2 cursor-pointer text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-1.5 text-center" for="file-input-{{order}}">Upload Cover Artikel</label>
                    <input id="file-input-{{order}}" type="file" name="article-cover" onchange="show_file_name(this)" class="hidden" accept=".jpg,.png"/>
                </div>

                <div class="flex justify-center">
                    <span id="filename"></span>
                </div>

            </div>

            <div id="article-content-{{order}}" >{% if content %}{{content|safe}}{% endif %}</div>
            
            <input type="hidden" id="article-defined-{{order}}" {% if article %}value="{{article}}"{% endif %} />
            <textarea hidden name="article-content" id="article-content-textarea-{{order}}"></textarea>
            <label for="article-1" class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
                Judul Artikel
            </label>
        </div>
        <div id="action-{{order}}" class="hidden gap-3">
            <button id="submit-{{order}}" type="submit" onclick="save()" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-1.5 text-center">Simpan</button>
            <button id="cancel-{{order}}" type="button" class=" text-gray-600 bg-gray-100 hover:bg-gray-200 focus:ring-4 focus:outline-none font-medium rounded-lg text-sm px-5 py-1.5 text-center"><svg class="w-6 h-6 text-gray-800 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
            </svg>
            </button>
        </div>
        <script>
            document.querySelector('#article-title-{% firstof order "1" %}').addEventListener('input', function() {
                document.querySelector('#action-{% firstof order "1" %}').classList.remove('hidden');
                document.querySelector('#action-{% firstof order "1" %}').classList.add('flex');
            });
            document.querySelector('#submit-{% firstof order "1" %}').addEventListener('click', function() {
                document.querySelector('#action-{% firstof order "1" %}').classList.add('hidden');
                document.querySelector('#action-{% firstof order "1" %}').classList.remove('flex');
            });
            document.querySelector('#cancel-{% firstof order "1" %}').addEventListener('click', function() {
                document.querySelector('#action-{% firstof order "1" %}').classList.add('hidden');
                document.querySelector('#action-{% firstof order "1" %}').classList.remove('flex');
                document.querySelector('#article-{% firstof order "1" %}').value = document.querySelector('#article-defined-{% firstof order "1" %}').value;
            });

            // summernote.change
            $('#article-content-{% firstof order "1" %}').on('summernote.change', function(we, contents, $editable) {
                document.querySelector('#action-{% firstof order "1" %}').classList.remove('hidden');
                document.querySelector('#action-{% firstof order "1" %}').classList.add('flex');
                document.querySelector('#article-content-textarea-{% firstof order "1" %}').value = $('#article-content-{% firstof order "1" %}').summernote('code'); ;
            });
            // inputfile.change
            document.querySelector('#file-input-{% firstof order "1" %}').addEventListener('input', function() {
                document.querySelector('#action-{% firstof order "1" %}').classList.remove('hidden');
                document.querySelector('#action-{% firstof order "1" %}').classList.add('flex');
                document.querySelector('#article-content-textarea-{% firstof order "1" %}').value = $('#article-content-{% firstof order "1" %}').summernote('code'); ;
            });

            $( document ).ready(function (){
                const Dropdown = window.Dropdown
                new Dropdown(document.getElementById('manage-article-menu-{{order}}'), document.getElementById('manage-article-{{order}}'));
            
                $('#article-content-{% firstof order "1" %}').summernote({
                    placeholder: 'Buat Artikel Anda disini',
                    tabsize: 2,
                    height: 120,
                    toolbar: [
                        [ 'style', [ 'style' ] ],
                        [ 'font', [ 'bold', 'italic', 'underline', 'strikethrough', 'superscript', 'subscript', 'clear'] ],
                        [ 'fontname', [ 'fontname' ] ],
                        [ 'fontsize', [ 'fontsize' ] ],
                        [ 'color', [ 'color' ] ],
                        [ 'para', [ 'ol', 'ul', 'paragraph', 'height' ] ],
                        [ 'table', [ 'table' ] ],
                        [ 'insert', [ 'link'] ],
                        [ 'view', [ 'undo', 'redo', 'fullscreen', 'codeview', 'help' ] ]
                    ]
                });
            });
            function show_file_name(elm){
                var previewFile = elm.parentElement.parentElement.querySelector('#image-cover')
                var file = elm.files[0];

                
                if (file) {
                    var reader = new FileReader();

                    reader.onload = function (e) {
                        previewFile.src = e.target.result;
                    };
                    var file = elm.files[0];

                    reader.readAsDataURL(file);
                    previewFile.parentElement.parentElement.classList.remove('hidden');
                }
            }
        </script>
    </form>
</div>
