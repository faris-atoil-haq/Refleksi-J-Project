<div class="w-[80%] md:w-1/2 ps-1 pe-3 py-2 mb-3 bg-white border border-gray-200 rounded-lg shadow" id="option-card-{{question_id}}-{{option_order}}">
    <input type="hidden" name="option_id" value="{{option_id}}" />
    <div class="flex items-center">
        <div class="option-grab-handle cursor-grab">
            <svg class="me-3" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-grip-vertical" viewBox="0 0 16 16">
                <path d="M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0M7 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0M7 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0m-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0m-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
            </svg>
        </div>
        <input type="text" id="option-{{option_order}}" name="text" class="me-3 block px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder="Teks pilihan" 
            {% if text %}value="{{text}}"{% endif %} required hx-get="{% url 'manage_angket_option' angket_id=question_id id=option_id %}" hx-trigger="change" hx-swap="none"
            hx-disinherit="*"/>
        
        <button class="rounded-md hover:bg-red-600 hover:text-white" hx-get="{% url 'manage_angket_option' angket_id=question_id id=option_id %}" hx-vals='{"delete":"delete"}' hx-target="#option-card-{{question_id}}-{{option_order}}">
            <svg class="w-6 h-6 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
            </svg>
        </button>
    </div>
</div>
