{% extends 'core/_base.html' %}

{% block content %}
    <div class="mb-8">
        <div class="mb-4"><a href="{% url 'subject_page' %}">Kembali</a></div>
        <form method="POST" action="{% url 'create_subject' %}" class="flex flex-col gap-3">
            {% csrf_token %}
            <input type="text" class="input-sm" name="name" placeholder="Nama mata pelajaran">
            <button type="submit" class="btn btn-primary w-fit">Tambahkan</button>
        </form>
    </div>
{% endblock %}
