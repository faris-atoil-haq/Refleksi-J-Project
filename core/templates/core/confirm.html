{% extends "_base.html" %}
{% load static %}

{% block content %}
  

<div class="flex justify-center py-8">
    <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow md:p-8">
        {% if verified %}
            Akun anda berhasil di verifikasi
            <div class="text-sm font-medium text-gray-500">
                <a href="{% url 'login' %}"class="text-blue-700 hover:underline">Masuk di sini</a>
            </div>
        {% else %}
            Email konfirmasi sudah dikirim ke e-mail Anda. Silahkan cek e-mail Anda untuk melakukan verifikasi.
        {% endif %}
    </div>
</div>

{% endblock content %}
