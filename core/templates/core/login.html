{% extends "_base.html" %}
{% load static %}

{% block content %}
  

<div class="flex justify-center py-8">
    <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow md:p-8">
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <h5 class="mb-6 text-xl font-medium text-gray-900">Masuk Akun</h5>
            <div class="mb-4">
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email Anda</label>
                <input type="email" name="email" autocomplete="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="name@email.com" required 
                    {% if email %}value="{{email}}"{% endif %}
                    >
            </div>
            <div class="mb-4">
                <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Kata Sandi</label>
                <input type="password" name="password" autocomplete="current-password" id="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 {% if error_message and email %}outline ring-red-500 outline-red-500{% endif %}" required>
                {% if error_message and email%}
                    <script>
                        document.getElementById('password').addEventListener('focus', function(){
                            this.classList.remove('outline')
                            this.classList.remove('ring-red-500')
                            this.classList.remove('outline-red-500')
                        })
                    </script>
                {% endif %}
            </div>
            {% if error_message %}
                <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
                    {{error_message}}
                </div>
            {% endif %}
            <button type="submit" class="mb-6 w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Masuk</button>
            <a href="#" class="ms-auto text-sm text-blue-700 hover:underline">Lupa Kata Sandi?</a>
            <div class="text-sm font-medium text-gray-500">
                Belum punya akun? <a href="#" class="text-blue-700 hover:underline">Daftar di sini</a>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
